<script type="text/discourse-plugin" version="0.8">
  // O Discourse só tem um método de login (DiscourseConnect) — a tela
  // "login-required" (alcançada tanto por load direto quanto por transição
  // interna, ex.: depois de Sair) nunca precisa aparecer: clica o próprio
  // botão de entrar assim que a rota carrega, levando direto para a tela
  // estilizada do Revivah.
  api.onPageChange(() => {
    if (document.body.classList.contains("static-login")) {
      const botao = document.querySelector(".login-button");
      if (botao) botao.click();
    }
  });
</script>
